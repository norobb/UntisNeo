name: Build iOS IPA

on:
  push:
    tags:
      - 'ios-*'

jobs:
  build_ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./untisneo-ios
