name: Build iOS IPA

on:
  push:
    tags:
      - 'ios-*'

jobs:
  build_ios:
    name: Build iOS (.ipa)
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./untisneo-ios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project (Expo)
        run: npx expo prebuild --platform ios

      - name: Build Unsigned iOS App
        run: |
          cd ios
          xcodebuild -workspace untisneoios.xcworkspace \
            -scheme untisneoios \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            EXCLUDED_ARCHS="armv7" \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/build
          mkdir Payload
          cp -r untisneoios.app Payload/
          zip -r untisneoios.ipa Payload

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: untisneo-ios/ios/build/untisneoios.ipa
          name: iOS Unsigned Release ${{ env.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
